aid: candid-co
name: Candid Co.
description: 'Candid Co. (candidco.com), operating today as CandidPro, is a New York-based dental-technology
  company that delivers custom clear aligners for teeth straightening. Founded in 2017 as a direct-to-consumer
  brand backed by Bessemer Venture Partners, Greycroft, and e.ventures, Candid pioneered at-home impression
  kits and remote monitoring, and has since pivoted to a dentist-directed model: aligners are prescribed and
  overseen by a licensed dentist with orthodontist support and convenient virtual visits (CandidMonitoring).
  Candid handles the clinical treatment plan, 3D-printed aligner manufacturing, and patient communication for
  crowding and common bite misalignments. This is a consumer/health brand with no public developer API; this
  profile captures its identity, domain security posture, and commercial link properties.'
